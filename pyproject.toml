[project]
name = "research-tools"
version = "0.1.0"
description = "Search and paper-fetching tools for AI safety research skills"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "arxiv>=2.1",
    "pypdf>=4.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "peft>=0.19.1",
    "huggingface-hub>=1.24.0",
    "accelerate>=1.14.0",
    "datasets>=3.0",
    "sentence-transformers>=3.0",
    "python-pptx>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
